# Seed merchant dictionary for SPEND.
#
# name:     display name
# category: one of Food, Groceries, Transport, Shopping, Bills,
#           Entertainment, Health, Income, Other
# aliases:  strings that appear in SMS merchant fields (matched after
#           normalisation: lower-case, punctuation and "pvt ltd" style
#           suffixes removed). The longest matching alias wins, so
#           "swiggy instamart" beats "swiggy".
# vpas:     known UPI handles. Example handles are illustrative.
#
# Also matched against the local part of a VPA: "bigbasket.payu@hdfcbank"
# hits the "bigbasket" alias.

version: "2026.10.1"

