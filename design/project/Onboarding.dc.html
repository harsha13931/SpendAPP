<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPEND · Connect your money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#175CD3}a:hover{color:#1849A9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px 16px; background: #F2F4F7; font-family: Inter, system-ui, sans-serif; color: #101828">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #475467">SPEND</span>
    <span style="font-size: 13px; color: #475467">Step 2 of 3</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 28px; line-height: 1.15; font-weight: 600">How should SPEND see your payments?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #475467">Pick one now. You can add another source later in Privacy.</p>
  </div>

  <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Data source</legend>

    <label style="display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 2px solid #101828; cursor: pointer">
      <input type="radio" name="source" value="aa" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #101828">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; font-weight: 600">Link bank accounts</span>
        <span style="font-size: 14px; line-height: 1.45; color: #475467">Through an RBI-licensed Account Aggregator. You approve each bank and can revoke any time. Works on Android and iPhone.</span>
      </span>
    </label>

    <label style="display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E7EC; cursor: pointer">
      <input type="radio" name="source" value="sms" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #101828">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; font-weight: 600">Read bank SMS on this phone</span>
        <span style="font-size: 14px; line-height: 1.45; color: #475467">Only bank and UPI alerts, parsed on your phone. OTPs and personal chats are skipped.</span>
        <span style="align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 500; color: #7A2E0E; background: #FFF4ED; padding: 3px 8px; border-radius: 8px">Needs SMS permission</span>
      </span>
    </label>

    <label style="display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E7EC; cursor: pointer">
      <input type="radio" name="source" value="manual" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #101828">
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; font-weight: 600">Share or paste alerts</span>
        <span style="font-size: 14px; line-height: 1.45; color: #475467">Share a bank SMS to SPEND from your messages app, or add a payment by hand.</span>
      </span>
    </label>
  </fieldset>

  <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: #E7EDF8">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1849A9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"></path></svg>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #1849A9">SPEND never asks for your bank password, PIN or OTP, and never moves money.</p>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #101828; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Continue</a>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 500; text-decoration: none">Try with sample data</a>
  </div>
</div>
</x-dc>

</body>
</html>
